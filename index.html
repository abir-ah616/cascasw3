    <style>
        /* Custom Animations & Scrollbar */
        body {
            font-family: 'Zen Maru Gothic', sans-serif;
            background-color: #f3f4f6;
            background-image: 
                radial-gradient(#d1d5db 1px, transparent 1px),

            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            overflow: hidden;
        }

            font-family: 'Shrikhand', cursive;
        }

        /* Custom Scrollbar */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: #f3e8ff;
            border-radius: 20px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background-color: #e9d5ff;
        }

        /* Animations */
        .fade-enter {
            opacity: 0;
            transform: translateY(10px);
        }
        .fade-enter-active {
            opacity: 1;
            transform: translateY(0);
            transition: opacity 300ms ease-out, transform 300ms ease-out;
        }
        .fade-exit {
            opacity: 1;
            transform: translateY(0);
        }
        .fade-exit-active {
            opacity: 0;
            transform: translateY(-10px);
            transition: opacity 200ms ease-in, transform 200ms ease-in;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 3s ease-in-out infinite;
        }
        
        /* Range Slider Styling (omitted for brevity) */
        input[type=range] {
            -webkit-appearance: none; 
            width: 100%; 
            background: transparent; 
            height: 6px;
            cursor: pointer;
        }
        
        input[type=range]:focus {
            outline: none;
        }

        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #fce7f3;
            border-radius: 0;
        }
        
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #f472b6;
            cursor: pointer;
            margin-top: -3px;
            box-shadow: 0 0 2px rgba(0,0,0,0.1);
        }

        /* Window Controls Hover Effects */
        .win-btn:hover {
            background-color: #e5e7eb;
        }
        .win-btn-close:hover {
            background-color: #ef4444;
            color: white;
        }
        
        /* Draggable Title Bar */
        #title-bar {
            cursor: default;
            touch-action: none;
        }

        /* Window State Classes */
        #app-window {
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: bottom center;
            z-index: 10;
        }

        /* Class added via JS during drag to prevent lag */
        #app-window.dragging {
            transition: none !important;
        }

        /* --- New Mobile Zoom Scaling --- */
        @media (max-width: 767px) {
            /* Define the target width for the desktop simulation (using 900px base) */
            :root {
                /* Calculate scale factor based on viewport width minus 40px margin, divided by target width */
                --mobile-target-width: 900px;
                --scale-factor: calc((100vw - 40px) / var(--mobile-target-width));
            }

            #app-window:not(.maximized) {
                /* Force full desktop size as a base */
                width: var(--mobile-target-width) !important;
                height: 550px !important;
                min-height: 550px !important;

                /* Override margin/auto and use fixed position for center */
                margin: 0 !important;
                position: fixed !important; 
                top: 50% !important;
                left: 50% !important;

                /* Apply the calculated scale and center it */
                transform: translate(-50%, -50%) scale(var(--scale-factor)) !important;
                
                /* Ensure it's fully visible and interactive */
                opacity: 1 !important;
                pointer-events: auto !important;
            }
        }
        /* --- End New Mobile Zoom Scaling --- */


        /* Maximized state uses fixed positioning and removes all transforms/scaling */
        .maximized {
            position: fixed !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            border-radius: 0 !important;
            margin: 0 !important;
            transform: none !important; /* Important: removes scaling */
            z-index: 50 !important;
        }

        .minimized {
            transform: scale(0.5) translateY(120vh) !important;
            opacity: 0 !important;
            pointer-events: none;
        }
        
        /* Mobile content padding adjustment is no longer needed due to scaling, but we will ensure it's removed */
        @media (max-width: 767px) {
             #content-area {
                padding-top: 3rem !important; /* Resetting to standard p-6 mobile/md:p-12 desktop */
            }
        }

    <script>
        lucide.createIcons();

        const titleBar = document.getElementById('title-bar');
        const dockIcon = document.getElementById('dock-icon');
        const btnMinimize = document.getElementById('btn-minimize');
        const btnMaximize = document.getElementById('btn-maximize');

        // --- Minimize / Maximize Logic ---
        let isMaximized = false;

        btnMinimize.addEventListener('click', () => {
            // Safety: Ensure dragging class is removed so transition can run
            appWindow.classList.remove('dragging');
            
            // Force reflow to ensure browser registers start position for animation
            void appWindow.offsetWidth;
            
            appWindow.classList.add('minimized');
            dockIcon.classList.remove('translate-y-40', 'opacity-0');
        });

        window.restoreWindow = () => {
            appWindow.classList.remove('minimized');
            dockIcon.classList.add('translate-y-40', 'opacity-0');
        };

        btnMaximize.addEventListener('click', () => {
            isMaximized = !isMaximized;
            // Safety: Remove dragging class
            appWindow.classList.remove('dragging');
            
            if (isMaximized) {
                appWindow.classList.add('maximized');
            } else {
                appWindow.classList.remove('maximized');
            }
        });


        // --- Window Dragging Logic (Mouse & Touch) ---
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        function startDrag(e) {
            // Don't drag if maximized or clicking window controls
            if(isMaximized || e.target.closest('.win-btn') || e.target.closest('.win-btn-close')) return;

            isDragging = true;
            // DISABLE TRANSITION DURING DRAG to prevent lag/throwing effect
            appWindow.classList.add('dragging');
            
            if (e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }

            const rect = appWindow.getBoundingClientRect();

            // Switch to absolute positioning if not already. Crucial for touch dragging on a scaled element.
            // If the element is scaled, we must ensure its position is defined by px values before dragging starts.
            if (window.getComputedStyle(appWindow).position !== 'fixed' && !appWindow.classList.contains('maximized')) {
                // Calculate position relative to the viewport after scaling
                const scaleFactor = getComputedStyle(document.documentElement).getPropertyValue('--scale-factor') || 1;
                
                // Get unscaled center of the window (which is where the CSS transform places it)
                const windowWidth = appWindow.offsetWidth; // This is the unscaled 900px width
                const windowHeight = appWindow.offsetHeight; // This is the unscaled 550px height

                // If on mobile, the window is scaled and fixed. We should calculate its current screen position.
                // On mobile non-maximized, position is fixed, so we don't need to manually set left/top from rect.
                // We only need to manually set position if we're moving from a non-absolute/fixed state.
                
                if (window.innerWidth >= 768) { 
                    // Desktop (not scaled)
                    appWindow.style.position = 'absolute';
                    appWindow.style.left = `${rect.left}px`;
                    appWindow.style.top = `${rect.top}px`;
                    appWindow.style.margin = '0';
                    appWindow.style.transform = 'none'; 
                }
                // On mobile, the window is already 'fixed' and centered via CSS transform, 
                // dragging is disabled by the mobile fixed/scaled setup for simplicity.
            }
            
            initialLeft = parseFloat(appWindow.style.left) || rect.left;
            initialTop = parseFloat(appWindow.style.top) || rect.top;
            
            if(e.type === 'mousedown') e.preventDefault();
        }

        function doDrag(e) {
            if (!isDragging || isMaximized) return;

            let clientX, clientY;

            if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }

            const dx = clientX - startX;
            const dy = clientY - startY;

            appWindow.style.left = `${initialLeft + dx}px`;
            appWindow.style.top = `${initialTop + dy}px`;
            
            if(e.type === 'touchmove') e.preventDefault();
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            // RE-ENABLE TRANSITIONS after drag ends
            appWindow.classList.remove('dragging');
        }

        // Only enable dragging on desktop (larger than mobile breakpoint)
        if (window.innerWidth >= 768) {
            titleBar.addEventListener('mousedown', startDrag);
            document.addEventListener('mousemove', doDrag);
            document.addEventListener('mouseup', endDrag);
            // Touch dragging is complex with the scaling logic, so we keep it mouse-only for the desktop view
            // titleBar.addEventListener('touchstart', startDrag, { passive: false });
            // document.addEventListener('touchmove', doDrag, { passive: false });
            // document.addEventListener('touchend', endDrag);
        } else {
             // On mobile, just prevent selection and keep title bar responsive
             titleBar.style.cursor = 'default';
        }


        // --- Audio Player Logic (omitted for brevity) ---
        const audio = document.getElementById('bg-music');
        const playBtn = document.getElementById('play-btn');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const discIcon = document.querySelector('.play-spin');
        const seekSlider = document.getElementById('seek-slider');

        function togglePlay() {
            if (audio.paused) {
                audio.play().then(() => {
                    playBtn.innerHTML = '<i data-lucide="pause" class="w-4 h-4 ml-0.5"></i>';
                    lucide.createIcons();
                    discIcon.style.animationPlayState = 'running';
                }).catch(e => console.log("Audio error:", e));
            } else {
                audio.pause();
                playBtn.innerHTML = '<i data-lucide="play" class="w-4 h-4 ml-0.5"></i>';
                lucide.createIcons();
                discIcon.style.animationPlayState = 'paused';
            }
        }

        function restartTrack() {
            audio.currentTime = 0;
            if(audio.paused) {
                togglePlay();
            }
        }

        playBtn.addEventListener('click', togglePlay);
        prevBtn.addEventListener('click', restartTrack);
        nextBtn.addEventListener('click', restartTrack);

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progress = (audio.currentTime / audio.duration) * 100;
                seekSlider.value = progress;
                const value = ((progress - seekSlider.min) / (seekSlider.max - seekSlider.min)) * 100;
                seekSlider.style.background = `linear-gradient(to right, #f472b6 0%, #f472b6 ${value}%, #fce7f3 ${value}%, #fce7f3 100%)`;
            }
        });

        seekSlider.addEventListener('input', () => {
            if (audio.duration) {
                const seekTime = (seekSlider.value / 100) * audio.duration;
                audio.currentTime = seekTime;
                const value = ((seekSlider.value - seekSlider.min) / (seekSlider.max - seekSlider.min)) * 100;
                seekSlider.style.background = `linear-gradient(to right, #f472b6 0%, #f472b6 ${value}%, #fce7f3 ${value}%, #fce7f3 100%)`;
            }
        });

        // Content Templates (omitted for brevity)
        const contents = {
            home: `
                <div class="flex flex-col items-center text-center space-y-6 fade-enter-active">
                    <div class="relative w-full max-w-[280px] aspect-video rounded-2xl overflow-hidden shadow-sm">

                    <div class="space-y-2">
                        <h2 class="text-xl font-cute text-gray-700">fandoms I'm in</h2>

        function switchTab(tabName) {
            buttons.forEach(btn => {
                btn.classList.remove('text-pink-300');
                btn.classList.add('text-gray-300');

                if(btn.id === `btn-${tabName}`) {
                    btn.classList.remove('text-gray-300');
                    btn.classList.add('text-pink-300');
                }
            });

            const oldContent = contentArea.firstElementChild;
            if (oldContent) {
                oldContent.classList.remove('fade-enter-active');
                oldContent.classList.add('fade-exit-active');
                
                setTimeout(() => {
                    renderContent(tabName);
                }, 200);
            } else {
                renderContent(tabName);
            }
        }

        function renderContent(tabName) {
            contentArea.innerHTML = contents[tabName];
            lucide.createIcons();
            
            requestAnimationFrame(() => {
                const newContent = contentArea.firstElementChild;
                if (newContent) {
                    newContent.classList.add('fade-enter');
                    requestAnimationFrame(() => {
                        newContent.classList.add('fade-enter-active');
                        newContent.classList.remove('fade-enter');
                    });
                }
            });
        }

        // Initial Load
        renderContent('home');
